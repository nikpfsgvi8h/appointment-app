<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a6cff">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

</head>

<body>

<header class="app-header">
    Staff Dashboard
</header>

<main class="page full-screen">
    <div class="content">


        <h2>Book Appointment</h2>

        <label>Subject</label>
        <input type="text" id="subject">

        <label>Date</label>
        <input type="date" id="date">

        <label>Time</label>
        <input type="time" id="time">

        <label>Book With</label>
        <select id="with">
            <option value="">Select</option>
            <option value="hod">HOD</option>
        </select>

        <button onclick="bookAppointment('staff')">Book Appointment</button>
        <p id="msg"></p>

        <h2 style="margin-top:24px;">Appointments Calendar</h2>
        <div id="calendar"></div>

    </div>
</main>

<!-- FLOATING ACTION ICONS -->
<div class="action-icons">
    <div class="bell" onclick="toggleReminder()">🔔</div>
    <div class="logout-icon" onclick="logout()">➜]</div>
</div>

<!-- REMINDER PANEL -->
<div class="reminder-panel" id="reminderPanel">
    <h4>Upcoming Appointments</h4>
    <div id="reminders"></div>
</div>

<script src="app.js"></script>
<script>
checkAuth("staff");
loadCalendar("staff");
</script>

</body>
</html>
