<!DOCTYPE html>
<html>
<head>
  <title>Staff Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="loader"></div>
  <p>Loading Staff Dashboard...</p>
</div>

<header class="app-header">
  Staff Dashboard
</header>

<main class="page">
  <div class="card">

    <h2>Book Appointment</h2>

    <label>Subject</label>
    <input type="text" id="subject">

    <label>Date</label>
    <input type="date" id="date">

    <label>Time</label>
    <input type="time" id="time">

    <label>Book With</label>
    <select id="with">
      <option value="">Select</option>
      <option value="hod">HOD</option>
    </select>

    <button onclick="bookAppointment('staff')">Book Appointment</button>
    <p id="msg"></p>

    <h2 style="margin-top:24px;">Calendar</h2>
    <div id="calendarGrid" class="calendar-grid"></div>

    <h2 style="margin-top:24px;">Pending Requests</h2>

    <div class="action-buttons">
      <button onclick="approve(this)">Approve</button>
      <button onclick="reject(this)">Reject</button>
    </div>

  </div>
</main>

<!-- NOTIFICATION BELL -->
<div class="bell" onclick="toggleReminder()">
  🔔<span id="bell-count">0</span>
</div>

<!-- REMINDER PANEL -->
<div class="reminder-panel" id="reminderPanel"></div>

<script src="app.js"></script>
<script>
checkAuth("staff");
loadCalendarGrid();
loadReminders();

window.onload = () => {
  document.getElementById("loading-screen").style.display = "none";
};
</script>

</body>
</html>
