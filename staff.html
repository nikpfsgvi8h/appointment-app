<!DOCTYPE html>
<html>
<head>
  <title>STAFF Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon-192-v2.png" type="image/png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading-screen">
  <div class="loader"></div>
  <p>Loading STAFF Dashboard...</p>
</div>

<header class="app-header">STAFF Dashboard</header>

<main class="page">
  <div class="card">
    <h2>Book Appointment</h2>

    <label>Subject</label>
    <input id="subject">

    <label>Date</label>
    <input type="date" id="date">

    <label>Time</label>
    <input type="time" id="time">

    <label>Book With</label>
<select id="with">
  <option value="">Select</option>
  <option value="hod">HOD</option>
</select>


    <button onclick="bookAppointment()">Book Appointment</button>
    <p id="msg"></p>

    <h2>Calendar</h2>
    <div id="calendarGrid" class="calendar-grid"></div>
<h2 style="margin-top:24px;">Pending Requests</h2>
<div id="pendingRequests"></div>


    <h2>Pending Requests</h2>
    <div class="action-buttons">
      <button onclick="approve(this)">Approve</button>
      <button onclick="reject(this)">Reject</button>
    </div>
  </div>
</main>
<div class="fab-stack">
  <div class="fab bell" onclick="toggleReminder()">
    🔔<span id="bell-count">0</span>
  </div>
  <div class="fab logout" onclick="logout()">➜]</div>
</div>


<script src="app.js"></script>
<script>
window.onload = () => {
  checkAuth("staff");
  loadCalendarGrid();

  loadReminders();
loadPendingRequests();

  document.getElementById("loading-screen").style.display = "none";
};

</script>

</body>
</html>
