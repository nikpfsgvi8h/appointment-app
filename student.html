<!DOCTYPE html>
<html>
<head>
  <title>Student</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading-screen">
  <div class="loader"></div>
  <p>Loading...</p>
</div>

<header class="app-header">Student Dashboard</header>

<main class="page">
  <div class="card">

    <h2>Book Appointment</h2>

    <label>Subject</label>
    <input id="subject">

    <label>Date</label>
    <input type="date" id="date">

    <label>Time</label>
    <input type="time" id="time">

    <label>Schedule With</label>
    <select id="with">
      <option value="">Select</option>
      <option value="staff">Staff</option>
      <option value="hod">HOD</option>
    </select>

    <button onclick="bookAppointment('student')">Book</button>
    <p id="msg"></p>

    <h2>Calendar</h2>
    <div id="calendarGrid" class="calendar-grid"></div>

  </div>
</main>

<div class="bell" onclick="toggleReminder()">
  🔔<span id="bell-count">0</span>
</div>

<div class="reminder-panel" id="reminderPanel"></div>

<script src="app.js"></script>
<script>
checkAuth("student");
loadCalendarGrid();
loadReminders();
window.onload = () =>
  document.getElementById("loading-screen").style.display = "none";
</script>

</body>
</html>
